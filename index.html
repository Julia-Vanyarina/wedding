<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FBF8F1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Наша свадьба">
<title>Свадьба Севы и Юлии</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prata&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Тоскана: тёплый камень, оливка, терракота; голубой — из палитры свадьбы, для ссылок и выбранного */
:root{
  --stone:#FBF8F1;          /* айвори */
  --card:#FFFEFB;
  --ink:#2F2B27;
  --muted:#8A8178;
  --olive:#6B7A4B;
  --olive-soft:#EEF0E4;
  --terra:#6B7A4B;          /* основной акцент — оливковый */
  --terra-soft:#EEF0E4;
  --sky:#6E8CA6;
  --line:rgba(47,43,39,.10);
  --good:#6B7A4B;
  --warn:#B48A3C;
  --bad:#B0533F;
  --f-display:"Prata",Georgia,"Times New Roman",serif;
  --f-body:"Manrope","Segoe UI",Roboto,Arial,sans-serif;
  --r:14px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background-color:var(--stone);
  color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));
}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;line-height:1.1;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:14px}

/* Шапка */
header.top{padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:6px}
.brand{display:flex;align-items:center;gap:14px}
.brand svg{width:56px;height:40px;flex:none}
.brand h1{font-size:clamp(28px,6vw,40px)}
.brand .sub{font-size:15px;color:var(--muted);letter-spacing:.04em}
.syncbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px;font-size:14px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--olive);display:inline-block}
.dot.demo{background:var(--warn)} .dot.err{background:var(--bad)} .dot.busy{background:var(--sky);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.linkbtn{background:none;border:0;padding:0;color:var(--sky);text-decoration:underline;cursor:pointer;font-size:14px}

/* Навигация */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,254,251,.96);backdrop-filter:blur(6px);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));display:flex;justify-content:center}
nav.tabs .in{display:grid;grid-template-columns:repeat(6,1fr);gap:2px;width:100%;max-width:720px}
nav.tabs button{white-space:nowrap}
@media (max-width:420px){nav.tabs button{font-size:10.5px;letter-spacing:-.01em}nav.tabs button svg{width:22px;height:22px}}
nav.tabs button{background:none;border:0;border-radius:10px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12.5px;color:var(--muted);cursor:pointer}
nav.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--terra);background:var(--terra-soft)}
@media (min-width:900px){
  body{padding-bottom:40px}
  nav.tabs{position:sticky;top:0;bottom:auto;border-top:0;border-bottom:1px solid var(--line);padding-top:6px}
  nav.tabs button{flex-direction:row;justify-content:center;gap:8px;font-size:15px;padding:10px 6px}
}

main{display:flex;flex-direction:column;gap:18px;padding-block:16px 24px}
section[hidden]{display:none!important}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:0 1px 2px rgba(47,43,39,.04),0 6px 18px rgba(47,43,39,.04)}
.card h2{font-size:24px;margin-bottom:10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}

.btn{border:1px solid var(--ink);background:var(--ink);color:var(--card);border-radius:999px;padding:8px 18px;cursor:pointer;font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:6px;min-height:40px}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.terra{background:var(--terra);border-color:var(--terra)}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:#fff}
.btn:focus-visible,nav.tabs button:focus-visible,.item:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--sky);outline-offset:2px}

/* Сводка */
.hero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.days{font-family:var(--f-display);font-size:60px;line-height:1;color:var(--olive);font-weight:400}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kpi{border-top:1px solid var(--line);padding-top:8px}
.kpi b{display:block;font-family:var(--f-display);font-size:24px;font-weight:400}
.kpi span{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
@media (max-width:520px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpis .kpi:nth-child(3){grid-column:1/-1}.hero{grid-template-columns:1fr}}

.meter{height:12px;border-radius:999px;background:var(--olive-soft);overflow:hidden;position:relative;margin:8px 0 4px}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--olive);border-radius:999px}
.meter i.plan{background:rgba(94,107,60,.35)}
.meter.over i.plan{background:rgba(168,67,47,.4)}
.cats{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.cat .top{display:flex;gap:8px;justify-content:space-between;font-size:15px}
.cat .meter{height:8px;margin:4px 0 0}

/* Списки */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar input[type=search]{flex:1 1 180px;min-width:0}
input,select,textarea{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:40px;width:100%}
textarea{min-height:70px;resize:vertical}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--olive);border-color:var(--olive);color:var(--card)}
.list{display:flex;flex-direction:column}
.group-h{font-family:var(--f-display);font-size:18px;font-weight:400;padding:14px 2px 4px;color:var(--olive);display:flex;justify-content:space-between;align-items:baseline}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.item:hover{background:rgba(255,255,255,.5)}
.item .t{font-weight:500;min-width:0;overflow-wrap:anywhere}
.item .d{font-size:14px;color:var(--muted);grid-column:1/2;min-width:0;overflow-wrap:anywhere}
.item .r{grid-row:1/3;grid-column:2;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.pill{display:inline-block;font-size:12.5px;padding:2px 9px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.pill.ok{color:var(--good)} .pill.no{color:var(--bad)} .pill.q{color:var(--warn)} .pill.n{color:var(--muted)} .pill.sent{color:var(--sky)}
.pill.chosen{background:var(--olive);color:var(--card);border-color:var(--olive)}
.empty{padding:24px 6px;color:var(--muted);text-align:center}
.fam{display:flex;flex-direction:column;gap:2px;margin-bottom:12px}
.fam .meter{margin:6px 0 2px}
.split{margin:0 0 12px;font-size:14.5px}
.split summary{cursor:pointer;color:var(--muted);font-size:14px}
.split .row{padding:3px 0}
.payers{display:flex;flex-direction:column;gap:6px;margin-top:12px;padding:10px 12px;background:var(--olive-soft);border-radius:10px}
.task{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:10px 2px;border-bottom:1px solid var(--line)}
.tick{width:28px;height:28px;border-radius:8px;border:1.5px solid var(--olive);background:transparent;color:var(--card);font-size:16px;font-weight:700;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;margin-top:1px}
.task.done .tick{background:var(--olive)}
.ttext{background:none;border:0;padding:0;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0;overflow-wrap:anywhere;font-size:15.5px}
.task.done .ttext > span:first-child{color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(47,43,39,.3)}
.tnote{font-size:14px;color:var(--ink);background:var(--olive-soft);border-radius:8px;padding:4px 8px}
.tmeta{font-size:12.5px;color:var(--muted)}
.tick:focus-visible,.icon-btn:focus-visible,.note:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
.task{grid-template-columns:auto 1fr auto}
.ttext{cursor:default}
.icon-btn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--muted);font-size:16px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none}
.icon-btn:hover{color:var(--olive);border-color:var(--olive)}
.sec-h{display:flex;align-items:center;gap:8px;padding:16px 2px 6px}
.sec-name{font-family:var(--f-display);font-size:18px;color:var(--olive);flex:1;min-width:0;overflow-wrap:anywhere}
.notes{display:flex;flex-direction:column;gap:8px}
.dayplan{display:flex;flex-direction:column}
.pl{display:grid;grid-template-columns:96px 1fr auto;gap:12px;align-items:start;padding:10px 2px;border-bottom:1px solid var(--line)}
.pl time{font-weight:600;color:var(--olive);padding-top:2px;font-size:15px}
.pw{display:flex;flex-direction:column;gap:3px;min-width:0;overflow-wrap:anywhere;font-size:15.5px}
@media (max-width:420px){.pl{grid-template-columns:78px 1fr auto;gap:8px}.pl time{font-size:14px}}
.note{text-align:left;background:var(--olive-soft);border:0;border-radius:12px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.ntext{white-space:pre-wrap;overflow-wrap:anywhere;font-size:15.5px}
/* Сравнение площадок: на телефоне подпись строки над тремя колонками, на компьютере — слева */
.cmp{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));column-gap:10px;margin-top:12px}
.cmp-corner{display:none}
.cmp-h{display:flex;flex-direction:column;gap:4px;align-items:flex-start;padding-bottom:8px;min-width:0}
.cmp-h button{background:none;border:0;padding:0;text-align:left;cursor:pointer;font-family:var(--f-display);font-size:16px;line-height:1.2;overflow-wrap:break-word;hyphens:auto;-webkit-hyphens:auto;max-width:100%;color:var(--ink)}
.cmp-h button:hover{color:var(--olive)}
.cmp-l{grid-column:1/-1;font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);border-top:1px solid var(--line);padding-top:10px;margin-top:2px}
.cmp-c{font-size:15px;padding:3px 0 10px;min-width:0;overflow-wrap:anywhere}
.cmp-c b{font-weight:700}
.cmp-c .sub{display:block;font-size:12.5px;color:var(--muted)}
.cmp-c.best b{color:var(--good)}
.cmp-c .unk{color:var(--warn);font-weight:600}
.tag{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:999px;background:var(--olive-soft);color:var(--olive);margin-top:2px}
.cmp-act{display:flex;flex-direction:column;gap:6px;padding-top:10px;border-top:1px solid var(--line);min-width:0}
.cmp-act .btn{min-height:34px;padding:5px 10px;font-size:13.5px;justify-content:center}
@media (min-width:760px){
  .cmp{grid-template-columns:170px repeat(var(--n),minmax(0,1fr));column-gap:16px}
  .cmp-corner{display:block}
  .cmp-l{grid-column:auto;padding:10px 0;margin:0}
  .cmp-c{border-top:1px solid var(--line);padding:10px 0}
  .cmp-c b{font-size:16px}
  .cmp-h button{font-size:21px}
  .cmp-act{flex-direction:row;flex-wrap:wrap}
}

/* Журнал */
.log{display:flex;flex-direction:column}
.log .e{display:grid;grid-template-columns:110px 1fr;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line);font-size:15px}
.log .e time{color:var(--muted);font-size:13.5px}
.log .who{font-weight:600;color:var(--olive)}
@media (max-width:520px){.log .e{grid-template-columns:1fr;gap:2px}}

/* Диалог */
dialog{border:0;border-radius:18px;padding:0;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px);background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(58,43,34,.3)}
dialog::backdrop{background:rgba(58,43,34,.4)}
dialog form{display:flex;flex-direction:column;gap:12px;padding:20px}
dialog h3{font-size:26px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:14px;color:var(--muted)}
.fields2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:440px){.fields2{grid-template-columns:1fr}}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.err{color:var(--bad);font-size:14px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--card);padding:10px 16px;border-radius:12px;font-size:15px;z-index:50;max-width:calc(100vw - 32px)}
@media (min-width:900px){.toast{bottom:24px}}
.banner.update{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between;background:var(--olive-soft);border-color:rgba(107,122,75,.35);margin-bottom:10px}
.banner{background:#F7F1E3;border:1px solid rgba(180,138,60,.35);border-radius:var(--r);padding:12px 14px;font-size:15px}
footer{font-size:13.5px;color:var(--muted);text-align:center;padding:10px 0 20px}
code{background:rgba(58,43,34,.07);padding:1px 5px;border-radius:5px;font-size:.92em;overflow-wrap:anywhere}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11l8-6 8 6v8a1 1 0 0 1-1 1h-4v-5H9v5H5a1 1 0 0 1-1-1z"/></symbol>
  <symbol id="i-guests" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 19c.6-3.3 3-5 6-5s5.4 1.7 6 5"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14c2.6 0 4.4 1.5 5 4"/></symbol>
  <symbol id="i-venue" viewBox="0 0 24 24"><path d="M3 20h18M5 20V10l7-5 7 5v10"/><path d="M10 20v-5a2 2 0 0 1 4 0v5"/></symbol>
  <symbol id="i-money" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.6"/><path d="M6 9v.01M18 15v.01"/></symbol>
  <symbol id="i-log" viewBox="0 0 24 24"><path d="M7 4h10a1 1 0 0 1 1 1v15l-3-2-3 2-3-2-3 2V5a1 1 0 0 1 1-1z"/><path d="M9 9h6M9 13h4"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 12.5l2.6 2.6L16 9.5"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"/></symbol>
</svg>

<header class="top wrap">
  <div class="brand">
    <svg viewBox="0 0 56 40" aria-hidden="true">
      <path d="M4 34 C18 30 32 20 52 6" fill="none" stroke="#6B7A4B" stroke-width="1.6" stroke-linecap="round"/>
      <g fill="#6B7A4B" opacity=".8">
        <ellipse cx="14" cy="27" rx="6" ry="2.2" transform="rotate(-50 14 27)"/>
        <ellipse cx="18" cy="33" rx="6" ry="2.2" transform="rotate(10 18 33)"/>
        <ellipse cx="27" cy="20" rx="6.5" ry="2.3" transform="rotate(-55 27 20)"/>
        <ellipse cx="32" cy="25" rx="6.5" ry="2.3" transform="rotate(5 32 25)"/>
        <ellipse cx="40" cy="12" rx="6" ry="2.2" transform="rotate(-60 40 12)"/>
        <ellipse cx="45" cy="16" rx="6" ry="2.2" transform="rotate(0 45 16)"/>
      </g>
      <circle cx="23" cy="27" r="2.6" fill="#2F2B27"/><circle cx="37" cy="19" r="2.4" fill="#2F2B27"/>
    </svg>
    <div>
      <h1>Сева и Юлия</h1>
      <div class="sub">27 августа 2027 · учёт свадьбы</div>
    </div>
  </div>
  <div class="syncbar" id="syncbar"></div>
</header>

<nav class="tabs" aria-label="Разделы">
  <div class="in">
    <button data-tab="home"><svg><use href="#i-home"/></svg>Обзор</button>
    <button data-tab="guests"><svg><use href="#i-guests"/></svg>Гости</button>
    <button data-tab="venues"><svg><use href="#i-venue"/></svg>Площадки</button>
    <button data-tab="money"><svg><use href="#i-money"/></svg>Траты</button>
    <button data-tab="check"><svg><use href="#i-check"/></svg>Чек-лист</button>
    <button data-tab="log"><svg><use href="#i-log"/></svg>Журнал</button>
  </div>
</nav>

<main class="wrap">
  <div id="banner"></div>
  <section id="tab-home"></section>
  <section id="tab-guests" hidden></section>
  <section id="tab-venues" hidden></section>
  <section id="tab-money" hidden></section>
  <section id="tab-check" hidden></section>
  <section id="tab-log" hidden></section>
  <section id="tab-settings" hidden></section>
</main>
<footer class="wrap" id="footer"></footer>

<script>
"use strict";
/* ================= Версия приложения ================= */
const APP_VERSION = "1.15.0";
const APP_CHANGES = [
  { v: "1.15.0", d: "29.10.2026", t: "Иногородние гости: город и где остановятся, фильтр «Из других городов». Внесено: зал «Архангельский» выбран, аванс 100 000 ₽ оплачен; гости с работы; раздел чек-листа «Выбрать подрядчиков»; траты на рилсмейкера, координатора и сайт-приглашение." },
  { v: "1.14.1", d: "25.10.2026", t: "Исправлен обратный отсчёт: считаются календарные дни до 27 августа, без округления неполного дня вверх. Число обновляется при открытии приложения и после полуночи." },
  { v: "1.14.0", d: "24.10.2026", t: "Гости считаются по людям, а не по строчкам: «+1» добавляет человека, «+1?» идёт в «возможно». У записи можно указать, сколько в ней человек (например, «Люба и Вася» — 2). В заголовках групп — число людей." },
  { v: "1.13.2", d: "24.10.2026", t: "Кольца: 50 000 ₽ по плану." },

/* Считаем людей, а не строчки: в записи может быть несколько человек, «+1» — ещё один, «+1?» — возможно */
const gBase = x => Math.max(1, Number(x.count) || 1);
const gSure = x => gBase(x) + (x.plusOne === "Да" ? 1 : 0);
const gMaybePlus = x => x.plusOne === "Может быть" ? 1 : 0;
const isComing = x => x.status !== "Не придёт" && x.status !== "Под вопросом";
const sumBy = (arr, f) => arr.reduce((a, x) => a + f(x), 0);
function groupPeople(items) {
  const sure = sumBy(items.filter(isComing), gSure);
  const maybe = sumBy(items.filter(isComing), gMaybePlus) + sumBy(items.filter(x => x.status === "Под вопросом"), x => gSure(x) + gMaybePlus(x));
  return { sure, maybe };
}
function guestStats(d) {
  const real = d.guests;
  const coming = real.filter(isComing);
  const maybeG = real.filter(x => x.status === "Под вопросом");
  const expected = sumBy(coming, gSure);
  const plusMaybe = sumBy(coming, gMaybePlus);
  const maybePeople = sumBy(maybeG, gSure);
  return {
    entries: real.length,
    total: expected + maybePeople, expected, max: expected + plusMaybe + maybePeople + sumBy(maybeG, gMaybePlus), plusMaybe, maybe: maybePeople,
    confirmed: sumBy(real.filter(x => x.status === "Придёт"), gSure),
    declined: sumBy(real.filter(x => x.status === "Не придёт"), gBase),
    bySide: SIDES.map(s2 => ({ s: s2, n: sumBy(coming.filter(x => x.side === s2), gSure) }))
  };
}
/* На сколько гостей считаем смету: план (60–65), пока список не заполнен, но не меньше, чем по списку */
/* Сколько мест у каждой стороны: из плана, если он указан, иначе по списку; места жениха и невесты — пополам */
function sideCounts(d) {
  const gp = d.guestPlan || {};

  if (py || ps) return { counts: [py, ps], from: "plan" };

  const cnt = side => sumBy(coming.filter(x => x.side === side), gSure);

}
function guestsForCalc(d) {
  const listN = guestStats(d).expected;
  const plan = Number(d.guestPlan && d.guestPlan.calc) || 0;
  return Math.max(listN, plan);
}
function venueParts(v, d) {
  const amt = Number(v.amount) || 0;

  const listN = guestsForCalc(d);
  const n = perGuest ? ((Number(v.guestsCalc) || 0) > 0 ? Number(v.guestsCalc) : listN) : 0;
  const food = perGuest ? amt * n : amt;
  const service = Math.round(food * (Number(v.servicePct) || 0) / 100);
  const equipment = Number(v.equipment) || 0, corkage = Number(v.corkage) || 0, other = Number(v.otherFees) || 0;
  const fees = equipment + corkage + service + other;
  const calcN = (Number(v.guestsCalc) || 0) > 0 ? Number(v.guestsCalc) : 0;
  let atList = null, approx = false;
  if (perGuest && n !== listN) { const f = amt * listN; atList = f + equipment + corkage + other + Math.round(f * (Number(v.servicePct) || 0) / 100); }
  if (!perGuest && calcN && calcN !== listN && amt) { const f = Math.round(amt * listN / calcN); atList = f + equipment + corkage + other + Math.round(f * (Number(v.servicePct) || 0) / 100); approx = true; }
  return { perGuest, n: perGuest ? n : calcN, listN, food, service, equipment, corkage, other, total: food + fees, atList, approx };
}
function venueCost(v, d) { return venueParts(v, d).total; }
const venueKnown = v => (Number(v.amount) || 0) > 0;
function budgetCalc(d) {
  const chosen = d.venues.find(v => v.chosen);
  const known = d.venues.filter(venueKnown);
  let venue = null;
  if (chosen) venue = { v: chosen, cost: venueCost(chosen, d), paid: Number(chosen.paid) || 0, why: venueKnown(chosen) ? "выбранная площадка" : "выбранная площадка, сметы пока нет" };
  else if (known.length) { const top = known.map(v => ({ v, cost: venueCost(v, d) })).sort((a, b) => b.cost - a.cost)[0]; venue = { v: top.v, cost: top.cost, paid: 0, why: "площадка не выбрана — считаем самый дорогой вариант со сметой" }; }
  const cats = {}, byPayer = {};

  const addP = (p, plan, paid) => { const o = byPayer[p] || (byPayer[p] = { plan: 0, paid: 0 }); o.plan += plan; o.paid += paid; };
  if (venue) { cats["Площадка"] = { plan: venue.cost, paid: venue.paid }; addP(payerOf(venue.v), venue.cost, venue.paid); }
  const cv = venue ? covers(venue.v) : [];
  d.expenses.forEach(x => { if (cv.includes(x.cat)) return; const pl = Number(x.planned) || 0, pd = Number(x.paid) || 0; const c = cats[x.cat] || (cats[x.cat] = { plan: 0, paid: 0 }); c.plan += pl; c.paid += pd; addP(payerOf(x), pl, pd); });
  const plan = Object.values(cats).reduce((s, c) => s + c.plan, 0);
  const paid = Object.values(cats).reduce((s, c) => s + c.paid, 0);
  // по категориям отдельно: за счёт родителей и за счёт Юли и Севы
  const catsP = {}, catsC = {};
  const addC = (o, k, pl, pd) => { const c = o[k] || (o[k] = { plan: 0, paid: 0 }); c.plan += pl; c.paid += pd; };
  if (venue) addC(isParents(payerOf(venue.v)) ? catsP : catsC, "Площадка", venue.cost, venue.paid);
  d.expenses.forEach(x => { if (cv.includes(x.cat)) return; addC(isParents(payerOf(x)) ? catsP : catsC, x.cat, Number(x.planned) || 0, Number(x.paid) || 0); });
  // доли семей: общие траты родителей пополам
  const caps = (d.budget && d.budget.caps) || {};
  const shared = byPayer["Родители"] || { plan: 0, paid: 0 };
  const byG = byPayer[BY_GUESTS] || { plan: 0, paid: 0 };
  const half = (v, i) => i === 0 ? Math.floor(v / 2) : v - Math.floor(v / 2); // делим пополам без копеек
  const sc = sideCounts(d);
  const part = (v, i) => { const tot = sc.counts[0] + sc.counts[1]; if (!tot) return half(v, i); const a = Math.round(v * sc.counts[0] / tot); return i === 0 ? a : v - a; };
  const fam = FAMILIES.map((f, i) => {
    const own = byPayer[f] || { plan: 0, paid: 0 };
    const g = part(byG.plan, i), h = half(shared.plan, i);
    return { name: f, cap: Number(caps[f]) || 0, guests: sc.counts[i], byGuests: g, halfShare: h, own: own.plan,
      plan: own.plan + g + h, paid: own.paid + part(byG.paid, i) + half(shared.paid, i) };
  });
  const parents = { plan: fam.reduce((s, f) => s + f.plan, 0), paid: fam.reduce((s, f) => s + f.paid, 0) };
  const capsTotal = fam.reduce((s, f) => s + f.cap, 0);
  const couple = byPayer[COUPLE] || { plan: 0, paid: 0 };
  const scope = "Родители";
  return { sc, venue, cats, catsP, catsC, plan, paid, limit: capsTotal, free: capsTotal - parents.plan, toPay: plan - paid, covered: cv, byPayer, scope, scoped: parents, fam, parents, capsTotal, couple };
}
/* Сколько стоит вся свадьба, если выбрать эту площадку */
const covers = v => Array.isArray(v && v.covers) ? v.covers : [];
function weddingWith(v, d) {
  const cv = covers(v);
  const exp = d.expenses.filter(x => !cv.includes(x.cat));
  const other = exp.reduce((s, x) => s + (Number(x.planned) || 0), 0);
  const total = venueCost(v, d) + other;
  const scoped = (isParents(payerOf(v)) ? venueCost(v, d) : 0) + exp.filter(x => isParents(payerOf(x))).reduce((s, x) => s + (Number(x.planned) || 0), 0);

  const capsTotal = FAMILIES.reduce((s, f) => s + (Number(caps[f]) || 0), 0);
  return { total, scoped, free: capsTotal - scoped };
}

/* ================= GitHub ================= */
async function gh(method, body) {
  const { owner, repo, token } = S.cfg;
  const url = `https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/contents/${DATA_PATH}` + (method === "GET" ? `?t=${Date.now()}` : "");
  const res = await fetch(url, {
    method, cache: "no-store",
    headers: { "Accept": "application/vnd.github+json", "Authorization": `Bearer ${token}`, "X-GitHub-Api-Version": "2022-11-28", ...(body ? { "Content-Type": "application/json" } : {}) },
    body: body ? JSON.stringify(body) : undefined
  });
  return res;
}
function ghError(res) {
  if (res.status === 401) return "Ключ доступа не подходит или истёк. Проверьте его в настройках.";
  if (res.status === 403) return "У ключа нет права записи в репозиторий данных (Contents: Read and write).";
  if (res.status === 404) return "Репозиторий не найден. Проверьте имя владельца и репозитория в настройках.";
  return "GitHub ответил ошибкой " + res.status + ". Попробуйте ещё раз.";
}
async function ghLoad() {
  const res = await gh("GET");
  if (res.status === 404) {
    // Файла ещё нет — проверим, что сам репозиторий доступен, и создадим данные.
    const r2 = await fetch(`https://api.github.com/repos/${encodeURIComponent(S.cfg.owner)}/${encodeURIComponent(S.cfg.repo)}`, { headers: { "Authorization": `Bearer ${S.cfg.token}`, "Accept": "application/vnd.github+json" }, cache: "no-store" });
    if (!r2.ok) throw new Error(ghError(r2));
    return { data: null, sha: null };
  }
  if (!res.ok) throw new Error(ghError(res));
  const j = await res.json();
  return { data: JSON.parse(b64decode(j.content)), sha: j.sha };
}
async function ghSave(data, sha, message) {
  const res = await gh("PUT", { message, content: b64encode(JSON.stringify(data, null, 1)), ...(sha ? { sha } : {}) });
  if (res.status === 409 || res.status === 422) return { conflict: true };
  if (!res.ok) throw new Error(ghError(res));
  const j = await res.json();
  return { sha: j.content.sha };
}

/* ================= Загрузка и сохранение ================= */
function setStatus(st, err = "") { S.status = st; S.error = err; renderSync(); }
async function load(quiet) {
  if (S.mode === "demo") {
    S.data = LS.get("wedding.demo", null) || seed();
    LS.set("wedding.demo", S.data); renderAll(); await migrate(); return;
  }
  if (!quiet) setStatus("busy");
  try {
    let { data, sha } = await ghLoad();
    if (!data) {
      data = seed(); data.log.unshift({ ts: new Date().toISOString(), who: S.who || "Приложение", text: "Подключён GitHub, создан файл данных" });
      const r = await ghSave(data, null, "Создан файл данных свадьбы");
      if (r.conflict) return load(quiet);
      sha = r.sha;
    }
    S.data = data; S.sha = sha; S.lastSync = new Date(); LS.set("wedding.cache", data);
    setStatus("ok"); renderAll();
    await migrate();
  } catch (e) {
    S.data = S.data || LS.get("wedding.cache", null) || seed();
    setStatus("err", e.message || "Нет связи с GitHub"); renderAll();
  }
}

let migrating = false;
async function migrate() {
  if (migrating) return; migrating = true;
  try {
    for (const m of MIGRATIONS) {
      const done = (S.data && S.data.meta && S.data.meta.migrations) || [];
      if (done.includes(m.id)) continue;
      const ok = await mutate(m.text, d => {
        d.meta.migrations = d.meta.migrations || [];
        if (d.meta.migrations.includes(m.id)) return false;
        d.meta.migrations.push(m.id);
        m.fn(d);
      }, { who: "Обновление " + APP_VERSION, quiet: true });
      if (!ok) break;
    }
  } finally { migrating = false; }
}
/* Любое изменение = функция над данными + запись в журнал.
   Перед сохранением берём свежую версию с GitHub, чтобы не затереть чужие правки. */
async function mutate(text, fn, opts = {}) {
  const who = opts.who || S.who;
  if (!who) { askWho(() => mutate(text, fn, opts)); return false; }
  const stamp = d => {
    if (fn(d) === false) return false;
    d.meta.rev = (d.meta.rev || 0) + 1; d.meta.updated = new Date().toISOString(); d.meta.appVersion = APP_VERSION;
    d.log.unshift({ ts: d.meta.updated, who, text, rev: d.meta.rev });
    if (d.log.length > 1000) d.log.length = 1000;
    return true;
  };
  if (S.mode === "demo") { if (stamp(S.data) === false) return true; LS.set("wedding.demo", S.data); renderAll(); if (!opts.quiet) toast("Сохранено на этом устройстве"); return true; }
  setStatus("busy");
  for (let i = 0; i < 4; i++) {
    try {
      const fresh = await ghLoad();
      const d = fresh.data || seed();
      if (stamp(d) === false) { S.data = d; S.sha = fresh.sha; setStatus("ok"); renderAll(); return true; }
      const r = await ghSave(d, fresh.sha, `${who}: ${text}`);
      if (r.conflict) continue;
      S.data = d; S.sha = r.sha; S.lastSync = new Date(); LS.set("wedding.cache", d);
      setStatus("ok"); renderAll(); if (!opts.quiet) toast("Сохранено"); return true;
    } catch (e) { setStatus("err", e.message || "Нет связи с GitHub"); if (!opts.quiet) toast("Не сохранилось: " + (e.message || "нет связи")); return false; }
  }
  setStatus("err", "Кто-то одновременно сохранял изменения. Обновите и попробуйте ещё раз.");
  return false;
}

async function checkUpdate(manual) {

/* ================= Диалог редактирования ================= */
function field(f, val) {
  const id = "f-" + f.k;
  let input;
  if (f.type === "select") input = `<select id="${id}" name="${f.k}">${f.options.map(o => `<option ${o === val ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>`;
  else if (f.type === "textarea") input = `<textarea id="${id}" name="${f.k}">${esc(val)}</textarea>`;
  else if (f.type === "multi") input = `<div class="chips" id="${id}">${f.options.map(o => `<label class="chip" style="display:inline-flex;gap:6px;align-items:center"><input type="checkbox" name="${f.k}" value="${esc(o)}" style="width:auto;min-height:0" ${(val || []).includes(o) ? "checked" : ""}>${esc(o)}</label>`).join("")}</div>`;
  else if (f.type === "check") input = `<label style="display:flex;gap:8px;align-items:center;color:var(--ink);font-size:16px"><input type="checkbox" id="${id}" name="${f.k}" style="width:auto;min-height:0" ${val ? "checked" : ""}> ${esc(f.text)}</label>`;
  else input = `<input id="${id}" name="${f.k}" ${f.type === "number" ? `type="number" inputmode="numeric" min="0" step="1"` : `type="text"`} ${f.list ? `list="${id}-l"` : ""} value="${esc(val ?? "")}" ${f.req ? "required" : ""}>${f.list ? `<datalist id="${id}-l">${f.list.map(o => `<option value="${esc(o)}">`).join("")}</datalist>` : ""}`;
  return `<div class="field">${f.type === "check" ? "" : `<label for="${id}">${esc(f.label)}</label>`}${input}</div>`;
}
function openForm({ title, fields, value, onSave, onDelete, deleteLabel }) {
  const dlg = $("#dlg"), form = $("#dlgForm");
  const pairs = []; let buf = [];
  fields.forEach(f => { if (f.half) { buf.push(f); if (buf.length === 2) { pairs.push(buf); buf = []; } } else { if (buf.length) { pairs.push(buf); buf = []; } pairs.push([f]); } });
  if (buf.length) pairs.push(buf);
  form.innerHTML = `<h3>${esc(title)}</h3>` + pairs.map(p => p.length === 2 ? `<div class="fields2">${p.map(f => field(f, value[f.k])).join("")}</div>` : field(p[0], value[p[0].k])).join("") +
    `<div class="err" id="formErr"></div>
     <div class="actions"><button class="btn" value="save" type="submit">Сохранить</button><button class="btn ghost" type="button" data-close>Отмена</button><span class="spacer"></span>
     ${onDelete ? `<button class="btn danger" type="button" data-del>${esc(deleteLabel || "Удалить")}</button>` : ""}</div>`;
  form.onsubmit = async ev => {
    ev.preventDefault();
    const out = {};
    fields.forEach(f => { if (f.type === "multi") { out[f.k] = [...form.querySelectorAll(`input[name="${f.k}"]:checked`)].map(x => x.value); return; } const el = form.elements[f.k]; out[f.k] = f.type === "check" ? el.checked : f.type === "number" ? Math.max(0, Math.round(Number(el.value) || 0)) : el.value.trim(); });
    const bad = fields.find(f => f.req && !out[f.k]);
    if (bad) { $("#formErr").textContent = `Заполните поле «${bad.label}».`; return; }
    form.querySelector("[type=submit]").disabled = true;
    const ok = await onSave(out);
    if (ok !== false) dlg.close(); else form.querySelector("[type=submit]").disabled = false;
  };
  form.querySelector("[data-close]").onclick = () => dlg.close();
  const del = form.querySelector("[data-del]");
  if (del) del.onclick = async () => {
    if (!del.classList.contains("armed")) { del.classList.add("armed"); del.textContent = "Нажмите ещё раз, чтобы удалить"; return; }
    del.disabled = true; const ok = await onDelete(); if (ok !== false) dlg.close();
  };
  dlg.showModal();
  const first = form.querySelector("input:not([type=checkbox]),select,textarea"); if (first && matchMedia("(pointer:fine)").matches) first.focus();
}

function describeChange(k, a, b) {

  if (Array.isArray(b)) return `входит в площадку: ${b.length ? b.join(", ").toLowerCase() : "ничего"}`;

  if (typeof b === "number") return `${LABELS[k] || k} ${rub(a)} → ${rub(b)}`;
  if (typeof b === "boolean") return b ? "выбрана" : "снят выбор";
  return `${LABELS[k] || k}: ${a || "—"} → ${b || "—"}`;
}

function renderAll() {
  if (!S.data) return;
  renderSync(); renderBanner(); renderHome(); renderGuests(); renderVenues(); renderMoney(); renderChecklist(); renderLog(); renderSettings(); renderFooter();
}
document.addEventListener("click", async ev => {
  const t = ev.target.closest("[data-tab],[data-act],[data-edit-guest],[data-edit-venue],[data-edit-expense],[data-gf],[data-cmp],[data-choose-venue],[data-tick],[data-edit-task],[data-tf],[data-pf],[data-add-in],[data-edit-sec],[data-edit-note],[data-edit-plan]");
  if (!t) return;
  if (t.dataset.tab) return show(t.dataset.tab);
  if (t.dataset.editGuest) return editGuest(t.dataset.editGuest);
  if (t.dataset.editVenue) return editVenue(t.dataset.editVenue);
  if (t.dataset.editExpense) return editExpense(t.dataset.editExpense);
  if (t.dataset.gf) { S.gFilter[t.dataset.gf] = t.dataset.v; renderGuests(); return; }
  if (t.dataset.pf) { S.payFilter = t.dataset.pf; renderMoney(); return; }
  if (t.dataset.tf) { S.taskFilter = t.dataset.tf; renderChecklist(); return; }
  if (t.dataset.editTask) return editTask(t.dataset.editTask);
  if (t.dataset.addIn) return editTask(null, t.dataset.addIn);
  if (t.dataset.editSec) return editSection(t.dataset.editSec);
  if (t.dataset.editNote) return editNote(t.dataset.editNote);
  if (t.dataset.editPlan) return editPlan(t.dataset.editPlan);
  if (t.dataset.tick) {
    const id = t.dataset.tick, x0 = (S.data.tasks || []).find(y => y.id === id); if (!x0) return;
    const val = !x0.done;
    // сразу показываем отметку, потом сохраняем
    x0.done = val; renderChecklist();
    const ok = await mutate(`${val ? "отметил(а) выполненным" : "снял(а) отметку"}: «${x0.text.slice(0, 80)}»`, d => { const x = (d.tasks || []).find(y => y.id === id); if (!x || !!x.done === val) return false; x.done = val; x.doneBy = val ? S.who : ""; x.doneAt = val ? new Date().toISOString() : ""; });
    if (!ok) { x0.done = !val; renderChecklist(); }
    return;
  }
  if (t.dataset.cmp) {
    const id = t.dataset.cmp; let sel = compareIds(S.data);
    if (sel.includes(id)) { if (sel.length === 1) { toast("Оставьте хотя бы одну площадку"); return; } sel = sel.filter(x => x !== id); }
    else { if (sel.length >= 3) { toast("Сравниваем три площадки. Сначала уберите одну"); return; } sel.push(id); }
    LS.set("wedding.cmp", sel); renderVenues(); return;
  }
  if (t.dataset.chooseVenue) {
    const id = t.dataset.chooseVenue, v = S.data.venues.find(x => x.id === id); if (!v) return;
    mutate(`выбрал(а) площадку «${v.name}»`, d => { d.venues.forEach(x => x.chosen = x.id === id); });
    return;
  }
  const a = t.dataset.act;
  if (a === "add-guest") editGuest(null);
  else if (a === "add-venue") editVenue(null);
  else if (a === "add-expense") editExpense(null);
  else if (a === "edit-budget") editBudget();
  else if (a === "edit-guest-plan") editGuestPlan();
  else if (a === "add-task") editTask(null);
  else if (a === "add-section") editSection(null);
  else if (a === "add-note") editNote(null);
  else if (a === "add-plan") editPlan(null);
  else if (a === "settings") show("settings");
  else if (a === "refresh") load();
  else if (a === "check-update") checkUpdate(true).then(() => { if (S.tab === "settings") renderSettings(); });
  else if (a === "apply-update") applyUpdate();
  else if (a === "copy-link") copyLink();
  else if (a === "export") exportJson();
  else if (a === "disconnect") { forgetConnection(); S.cfg = null; S.mode = "demo"; load(); toast("GitHub отключён на этом устройстве"); }
  else if (a === "reset-demo") { LS.del("wedding.demo"); load(); toast("Демо-данные сброшены"); }
});
document.addEventListener("input", ev => {
  if (ev.target.id === "gq") { S.gFilter.q = ev.target.value; const pos = ev.target.selectionStart; renderGuests(); const el = $("#gq"); el.focus(); try { el.setSelectionRange(pos, pos); } catch {} }
});
document.addEventListener("submit", async ev => {
  if (ev.target.id !== "cfgForm") return;
  ev.preventDefault();
  const who = $("#c-who").value.trim(), owner = $("#c-owner").value.trim(), repo = $("#c-repo").value.trim(), token = $("#c-token").value.trim();
  if (who) { S.who = who; LS.set("wedding.who", who); }
  if (owner && repo && token) { S.cfg = { owner, repo, token }; rememberConnection(); S.mode = "github"; await load(); if (S.status === "ok") { toast("GitHub подключён"); show("home"); } }
  else { renderSync(); toast(who ? "Имя сохранено" : "Заполните логин, репозиторий и ключ"); }
});
function connectHash() { return "#connect=" + b64encode(JSON.stringify(S.cfg)).replace(/=+$/, ""); }
function parentLink() { return location.origin + location.pathname + connectHash(); }
/* Подключение хранится и в памяти браузера, и в адресе страницы.
   Так его не теряет ни иконка «На экран Домой» (у неё своя память на iPhone),
   ни встроенный браузер Telegram, ни очистка данных Safari. */
function rememberConnection() {
  if (!S.cfg) return;
  LS.set("wedding.cfg", S.cfg);
  try { document.cookie = "wedding_cfg=" + encodeURIComponent(JSON.stringify(S.cfg)) + ";max-age=" + 60 * 60 * 24 * 400 + ";path=" + location.pathname + ";SameSite=Lax" + (location.protocol === "https:" ? ";Secure" : ""); } catch {}
  if (location.hash !== connectHash()) history.replaceState(null, "", location.pathname + location.search + connectHash());
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch {}
}
function readCookieCfg() {
  try { const m = document.cookie.match(/(?:^|; )wedding_cfg=([^;]*)/); return m ? JSON.parse(decodeURIComponent(m[1])) : null; } catch { return null; }
}
function forgetConnection() {
  LS.del("wedding.cfg");
  try { document.cookie = "wedding_cfg=;max-age=0;path=" + location.pathname; } catch {}
  history.replaceState(null, "", location.pathname + location.search);
}
async function copyLink() {
  const link = parentLink();
  const out = $("#linkOut");
  out.innerHTML = `<div class="field"><label for="plink">Ссылка</label><input id="plink" readonly value="${esc(link)}"></div>`;
  try { await navigator.clipboard.writeText(link); toast("Ссылка скопирована"); } catch { const i = $("#plink"); i.focus(); i.select(); toast("Выделите и скопируйте ссылку"); }
}
function exportJson() {
  const blob = new Blob([JSON.stringify(S.data, null, 2)], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `wedding-data-rev${S.data.meta.rev}.json`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

/* ================= Старт ================= */
(function init() {
  // Ссылка для родителей: #connect=<данные подключения>
  const m = location.hash.match(/connect=([A-Za-z0-9+/_-]+)/);
  if (m) {
    try { const cfg = JSON.parse(b64decode(m[1].replace(/-/g, "+").replace(/_/g, "/"))); if (cfg.owner && cfg.repo && cfg.token) LS.set("wedding.cfg", cfg); } catch {}
  }
  S.cfg = LS.get("wedding.cfg", null) || readCookieCfg();
  if (S.cfg) rememberConnection();
  S.mode = S.cfg ? "github" : "demo";
  S.who = LS.get("wedding.who", "");
  S.data = S.mode === "github" ? LS.get("wedding.cache", null) : null;
  if (S.data) renderAll();
  show(LS.get("wedding.tab", "home"));
  load().then(() => { if (!S.who) askWho(); });
  // сами проверяем обновления: при открытии, при возвращении в приложение и раз в 30 минут
  setTimeout(() => checkUpdate(false), 1500);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) checkUpdate(false); });
  setInterval(() => { if (!document.hidden) checkUpdate(false); }, 30 * 60000);
  // Подтягиваем чужие правки: при возврате в приложение и раз в минуту
  document.addEventListener("visibilitychange", () => { if (!document.hidden && S.mode === "github") load(true); });
  setInterval(() => { if (!document.hidden && S.mode === "github" && !$("#dlg").open) load(true); }, 60000);
  // обратный отсчёт: перерисовываем при возвращении в приложение и каждую минуту проверяем, не сменился ли день
  let lastDays = daysLeft();
  const tickDays = () => { const n = daysLeft(); if (n !== lastDays && S.data && !$("#dlg").open) { lastDays = n; renderHome(); } };
  setInterval(tickDays, 60000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) tickDays(); });
})();
</script>
</body>
